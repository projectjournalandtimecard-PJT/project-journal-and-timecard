name: Build installers
# Windows .exe (NSIS) on windows-latest, macOS .dmg on macos-latest (Apple
# Silicon). WiX/MSI is deliberately absent - candle.exe chokes on the
# ampersand in "Project Journal & Timecard".
#
# Push to main        -> builds both installers, uploads them as Actions
#                        artifacts (login required, expire after 90 days).
# Push a v* tag       -> also attaches both installers to a DRAFT GitHub
#                        Release, which is a public permanent download link
#                        once you press Publish.
# Actions tab         -> Run workflow, to build on demand.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Needed by the release step to create the draft and upload assets.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            bundles: nsis
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            label: macos-arm64
            bundles: dmg
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri CLI (v2)
        run: cargo install tauri-cli --version "^2.0" --locked
      - name: Build installers
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: pjt-${{ matrix.label }}-installer
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
      - name: Attach to draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
          draft: true
          generate_release_notes: true
